<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerita Kita BETA</title>
<link rel="icon" type="image/jpeg" href="logo.png.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#5D0F1F',maroon2:'#8B1E3F',broken:'#FFF8E7',cream:'#FDE8C9',cream2:'#FFF1D6',gold:'#E8B86D',peach:'#FFDAB9'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="landing" class="fixed inset-0 z-[100] flex items-center justify-center p-4" style="background: linear-gradient(135deg, #FFF8E7 0%, #FFDAB9 50%, #FDE8C9 100%)">
<div class="w-full max-w-[420px]"><div class="soft-card rounded-[28px] p-7 text-center">
<img src="logo.png.jpg" class="w-[84px] h-[84px] rounded-full border-[3px] border-maroon mx-auto">
<h1 class="text-[36px] font-extrabold text-maroon mt-3">Cerita<span class="text-maroon2">Kita</span></h1>
<button onclick="enterApp()" class="w-full mt-5 bg-gradient-to-r from-maroon to-maroon2 text-[#FFF8E7] py-[14px] rounded-[14px] font-bold">Masuk sebagai anonimijon →</button>
<div class="mt-3 text-[9px] opacity-40" id="connStatus">Menghubungkan...</div>
</div></div></div>

<div class="max-w-[1200px] mx-auto px-4 pb-[120px]">
<header class="sticky top-0 z-20 soft-header px-4 py-3.5 flex items-center justify-between -mx-4 mb-2">
<div class="flex items-center gap-2.5 font-bold text-maroon"><img src="logo.png.jpg" class="w-9 h-9 rounded-full border-2 border-maroon">Cerita<br>Kita</div>
<div class="flex items-center gap-1.5"><button class="w-9 h-9 bg-[#FFFBF0] border-2 border-cream rounded-full grid place-items-center">🔔</button><button onclick="toggleDark()" class="w-9 h-9 bg-[#FFFBF0] border-2 border-cream rounded-full grid place-items-center">🌙</button><div class="text-[10px] bg-gradient-to-r from-maroon to-maroon2 text-[#FFF8E7] px-3 py-1.5 rounded-full font-bold">🌱 LV.1</div></div>
</header>

<div id="view-home" class="view active space-y-4">
<div class="soft-card clickable rounded-[22px] p-5"><h2 class="font-extrabold text-maroon">📜 Rules</h2><div id="homeRules" class="mt-3 text-[12px]">Loading...</div></div>
<div class="rounded-[22px] p-5 text-[#FFF8E7] border-[2.5px] border-maroon" style="background: linear-gradient(135deg, #5D0F1F 0%, #8B1E3F 100%)"><h2 class="font-extrabold">📢 Pengumuman</h2><div id="homePengumuman" class="mt-3 text-[12px]">Belum ada</div><div id="pengumumanDate" class="mt-2 text-[9px] opacity-50"></div></div>
<div class="soft-card-gold rounded-[22px] p-5"><h2 class="font-extrabold text-maroon">Ini Buat Iklan</h2><div id="iklanCarousel" class="mt-3 flex gap-3 overflow-x-auto"></div></div>
<div class="soft-card rounded-[22px] p-5"><h2 class="font-extrabold text-maroon">📰 Berita Kampus</h2><div id="beritaCarousel" class="mt-3 flex gap-3 overflow-x-auto"></div></div>
<div class="grid grid-cols-2 gap-3"><div class="soft-card rounded-[18px] py-5 text-center"><div class="font-extrabold text-maroon text-[26px]" id="lTotal">0</div><div class="text-[9px] font-bold opacity-60">TOTAL</div></div><div class="soft-card rounded-[18px] py-5 text-center"><div class="font-extrabold text-maroon text-[26px]">0🔥</div><div class="text-[9px] font-bold opacity-60">STREAK</div></div></div>
</div>

<div id="view-feed" class="view pt-0 mt-0">
<input id="searchM" oninput="handleSearch(this.value)" placeholder="🔍 Cari..." class="w-full bg-[#FFFBF0] border-2 border-cream rounded-full px-4 py-3 text-[12px] mb-3 outline-none">
<div class="soft-card rounded-[18px] p-4 mb-4"><div class="font-bold text-[12px] text-maroon">🏆 Top Confess</div><div id="topConfessList" class="mt-3 flex flex-col gap-2"></div></div>
<div class="flex gap-2 overflow-auto pb-2 scrollbar-hide"><button class="filter-btn active bg-maroon text-white border-2 border-maroon px-5 py-2 rounded-full text-[11px]" onclick="setCat('all',this)">Semua</button><button class="filter-btn bg-[#FFFBF0] border-2 border-maroon px-5 py-2 rounded-full text-[11px]" onclick="setCat('Perasaan',this)">💘 Perasaan</button><button class="filter-btn bg-[#FFFBF0] border-2 border-maroon px-5 py-2 rounded-full text-[11px]" onclick="setCat('Random',this)">🎉 Random</button></div>
<div id="feed" class="masonry mt-4 gap-4"></div>
</div>

<div id="view-game" class="view pt-0 mt-0">
<div class="soft-card rounded-[24px] p-5"><div class="font-extrabold text-maroon">🎡 Spin Harian</div><canvas id="spinCanvas" width="160" height="160" class="w-[160px] h-[160px] rounded-full border-[4px] border-maroon mt-4"></canvas><button id="spinBtn" onclick="doSpin()" class="w-full mt-4 bg-maroon text-white py-3 rounded-xl">SPIN SEKARANG 🎉</button><div id="spinResult" class="text-center mt-2 font-bold min-h-[20px]"></div></div>
<div class="soft-card rounded-[24px] p-5 mt-4"><div class="font-extrabold text-maroon">🐨 Catch Koala</div><div id="koalaArea" class="koala-area mt-3"></div><button onclick="startKoalaGame()" class="w-full mt-3 bg-maroon text-white py-2.5 rounded-xl">START CATCH 🐨</button><div class="text-right mt-1 text-[12px] font-bold" id="koalaScore">0</div></div>
</div>

<div id="view-profile" class="view pt-0 mt-0"><div class="soft-card rounded-[22px] p-6 text-center"><div class="w-20 h-20 mx-auto rounded-full border-2 border-maroon grid place-items-center text-[36px]">🦊</div><h2 class="font-extrabold text-maroon mt-4">anonimijon</h2><div id="myConfessList" class="mt-4 text-[11px]"></div></div></div>

</div>

<div class="bottom-nav">
<button id="nav-home" class="active" onclick="switchTab('home')">🏠 Home</button>
<button id="nav-feed" onclick="switchTab('feed')">💌 Confess</button>
<button id="nav-game" onclick="switchTab('game')">🎮 Game</button>
<button id="nav-profile" onclick="switchTab('profile')">👤 Profil</button>
</div>

<button id="spillBtn" onclick="openCreate()" class="fixed bottom-[88px] right-5 z-40 bg-gradient-to-r from-maroon to-maroon2 text-[#FFF8E7] px-6 py-3.5 rounded-full font-bold text-[13px] hidden">➕ Spill</button>
<div id="toast" class="fixed bottom-[90px] left-1/2 -translate-x-1/2 bg-maroon text-[#FFF8E7] px-6 py-3 rounded-full text-[13px] font-bold translate-y-[150px] opacity-0 transition-all duration-300 z-[200]"></div>

<script type="module" src="app.js"></script>
</body>
</html>
