<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerita Kita - Admin Panel</title>
<link rel="icon" type="image/jpeg" href="logo.png.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#5D0F1F',maroon2:'#8B1E3F',broken:'#FFF8E7',cream:'#FDE8C9',cream2:'#FFF1D6',gold:'#E8B86D',ink:'#2B0A12'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif} body{background:#FFF8E7} .scrollbar-hide::-webkit-scrollbar{display:none;}</style>
</head>
<body class="text-ink min-h-screen p-4">
<div class="max-w-[1100px] mx-auto pb-20">
  <div class="flex justify-between items-center mb-5 bg-white border-[2.5px] border-maroon rounded-[18px] p-4 shadow-[4px_4px_0px_#5D0F1F]">
    <div class="flex items-center gap-3">
      <img src="logo.png.jpg" class="w-10 h-10 rounded-full border-2 border-maroon object-cover">
      <div>
        <h1 class="text-[16px] font-extrabold text-maroon leading-none">Cerita Kita <span class="text-maroon2">Admin</span></h1>
        <div class="text-[10px] opacity-60 mt-1">cozzy place to confess • dibuat oleh Human/Error 2026</div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-[11px] bg-maroon text-[#FFF8E7] px-3 py-1 rounded-full font-bold" id="totalInfo">Loading...</div>
      <div class="text-[9px] opacity-50 mt-1">Maroon Cream Edition</div>
    </div>
  </div>

  <!-- HOME CONFIG EDITOR -->
  <div class="bg-white border-[2.5px] border-maroon rounded-[22px] p-5 shadow-[5px_5px_0px_#5D0F1F] mb-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="font-extrabold text-maroon text-[15px]">🏠 Edit Halaman Home</h2>
      <span class="text-[9px] bg-gold text-maroon px-2.5 py-1 rounded-full font-bold">LIVE FIREBASE</span>
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="text-[11px] font-bold text-maroon">📜 Rules (HTML boleh)</label>
        <textarea id="inputRules" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl p-3 text-[12px] min-h-[130px] outline-none" placeholder="<ul><li>Rules...</li></ul>"></textarea>
      </div>
      <div>
        <label class="text-[11px] font-bold text-maroon">📢 Pengumuman</label>
        <textarea id="inputPengumuman" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl p-3 text-[12px] min-h-[90px] outline-none" placeholder="Tulis pengumuman..."></textarea>
        <label class="text-[11px] font-bold text-maroon mt-2 block">Tanggal Pengumuman</label>
        <input id="inputTanggal" type="text" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl px-3 py-2 text-[12px] outline-none" placeholder="contoh: 24 Nov 2026">
      </div>
    </div>
    <div class="mt-4">
      <label class="text-[11px] font-bold text-maroon">💰 Iklan / Sponsor (HTML boleh, bisa pasang gambar/link)</label>
      <textarea id="inputIklan" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl p-3 text-[12px] min-h-[100px] outline-none" placeholder='<div><a href="...">Sponsor...</a></div>'></textarea>
      <div class="text-[9px] opacity-50 mt-1">Bisa pakai HTML: &lt;img&gt; &lt;a&gt; &lt;b&gt; dll</div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button onclick="loadHomeConfigAdmin()" class="bg-cream border-2 border-maroon py-2.5 rounded-xl font-bold text-[12px] text-maroon">↻ Load Data</button>
      <button onclick="saveHomeConfig()" id="saveHomeBtn" class="bg-maroon text-[#FFF8E7] py-2.5 rounded-xl font-bold text-[12px]">💾 Simpan Home</button>
    </div>
    <div id="saveHomeStatus" class="text-[10px] text-center mt-2 font-bold text-maroon"></div>
  </div>

  <div class="grid grid-cols-4 gap-2 mb-4">
    <div class="bg-white border-2 border-maroon rounded-[14px] p-3 text-center shadow-[3px_3px_0px_#5D0F1F]"><div class="text-[20px] font-extrabold text-maroon" id="statTotal">0</div><div class="text-[9px] font-bold opacity-60">TOTAL</div></div>
    <div class="bg-white border-2 border-maroon rounded-[14px] p-3 text-center shadow-[3px_3px_0px_#5D0F1F]"><div class="text-[20px] font-extrabold text-maroon" id="statToday">0</div><div class="text-[9px] font-bold opacity-60">HARI INI</div></div>
    <div class="bg-white border-2 border-maroon rounded-[14px] p-3 text-center shadow-[3px_3px_0px_#5D0F1F]"><div class="text-[20px] font-extrabold text-maroon" id="statFoto">0</div><div class="text-[9px] font-bold opacity-60">PAKAI FOTO</div></div>
    <div class="bg-white border-2 border-maroon rounded-[14px] p-3 text-center shadow-[3px_3px_0px_#5D0F1F]"><div class="text-[20px] font-extrabold text-maroon" id="statReport">0</div><div class="text-[9px] font-bold opacity-60">LV 3+</div></div>
  </div>

  <input id="searchAdmin" oninput="renderAdmin()" placeholder="🔍 Cari to / text / ip / badge / level..." class="w-full bg-white border-2 border-maroon rounded-full px-4 py-2.5 text-[12px] mb-4 outline-none shadow-sm">

  <div id="adminList" class="grid gap-3"></div>

  <footer class="bg-white border-[2.5px] border-maroon rounded-[22px] p-5 text-center shadow-[4px_4px_0px_#5D0F1F] mt-6">
    <div class="font-extrabold text-maroon text-[13px]">cozzy place to confess ☁️</div>
    <div class="text-[10px] opacity-50 mt-1">dibuat oleh Human/Error 2026 • Cerita Kita Admin</div>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCToBiaTsuCCWrDnKK8cI1aQf7BDHICsQ4", authDomain: "confess-f4711.firebaseapp.com", projectId: "confess-f4711", storageBucket: "confess-f4711.firebasestorage.app", messagingSenderId: "484779882136", appId: "1:484779882136:web:52ec1b393f5777e2b582ed" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "cnfss");
const colRef = collection(db, "confesses");

let allData = [];

// HOME CONFIG
window.loadHomeConfigAdmin = async function(){
  document.getElementById('saveHomeStatus').innerText = 'Loading...';
  try{
    const snap = await getDoc(doc(db, "home_config", "main"));
    if(snap.exists()){
      let d = snap.data();
      document.getElementById('inputRules').value = d.rules||'';
      document.getElementById('inputPengumuman').value = d.pengumuman||'';
      document.getElementById('inputTanggal').value = d.pengumumanDate||'';
      document.getElementById('inputIklan').value = d.iklan||'';
      document.getElementById('saveHomeStatus').innerText = '✅ Loaded dari Firebase';
    }else{
      document.getElementById('saveHomeStatus').innerText = 'Belum ada config, silakan buat baru';
    }
  }catch(e){ document.getElementById('saveHomeStatus').innerText = 'Error: '+e.message; }
}

window.saveHomeConfig = async function(){
  let btn = document.getElementById('saveHomeBtn');
  btn.disabled = true; btn.innerText = 'Menyimpan...';
  try{
    await setDoc(doc(db, "home_config", "main"), {
      rules: document.getElementById('inputRules').value,
      pengumuman: document.getElementById('inputPengumuman').value,
      pengumumanDate: document.getElementById('inputTanggal').value,
      iklan: document.getElementById('inputIklan').value,
      updatedAt: Date.now()
    }, {merge:true});
    document.getElementById('saveHomeStatus').innerText = '✅ Tersimpan! Home user langsung update';
  }catch(e){ document.getElementById('saveHomeStatus').innerText = '❌ '+e.message; }
  btn.disabled = false; btn.innerText = '💾 Simpan Home';
}
loadHomeConfigAdmin();

window.deleteConfess = async function(id){
  if(!confirm('Yakin hapus confess ini? Gak bisa dibalikin!')) return;
  await deleteDoc(doc(db,"confesses",id));
}

window.renderAdmin = function(){
  let s = document.getElementById('searchAdmin').value.toLowerCase();
  let filtered = allData.filter(c => {
    let txt = `${c.to} ${c.text} ${c.sender?.ip} ${c.badge} ${c.level?.title}`.toLowerCase();
    return txt.includes(s);
  });

  document.getElementById('adminList').innerHTML = filtered.map(c => {
    let time = new Date(c.time).toLocaleString('id-ID');
    let lvl = c.level? `${c.level.icon} LV.${c.level.lv} ${c.level.title} (${c.xp||0} XP)` : 'No level';
    let badge = c.badge||'-';
    let sender = c.sender? `IP: ${c.sender.ip||'-'} | ${c.sender.ua?.slice(0,60)}` : 'No sender info';
    let foto = c.photo? `<img src="${c.photo}" class="w-full h-48 object-cover rounded-xl mt-2 border-2 border-cream">` : '<div class="text-[10px] opacity-30 mt-2">No photo</div>';
    return `
    <div class="bg-white text-black rounded-[16px] p-4 border-[2.5px] border-maroon shadow-[4px_4px_0px_#5D0F1F] ${c.photo?'!border-gold':''}">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full grid place-items-center text-[16px] border-2 border-maroon" style="background:${c.color||'#FFF1D6'}">${c.avatar||'🦊'}</div>
          <div>
            <div class="font-bold text-[12px] text-maroon">To: ${c.to} | #${c.code} | ${c.cat}</div>
            <div class="text-[10px] opacity-60">${time} • ${c.replies?.length||0} reply • ${lvl} • ${badge}</div>
            <div class="text-[9px] opacity-50 mt-1">${sender}</div>
          </div>
        </div>
        <button onclick="deleteConfess('${c.firestoreId}')" class="bg-[#5D0F1F] text-white px-3 py-1.5 rounded-full text-[10px] font-bold">HAPUS</button>
      </div>
      <div class="mt-3 text-[13px] leading-6 bg-broken p-3 rounded-xl border-2 border-cream">${c.text}</div>
      ${foto}
      <div class="mt-2 flex gap-1 flex-wrap">${(c.tags||[]).map(t=>`<span class="text-[9px] bg-maroon text-[#FFF8E7] px-2 py-0.5 rounded-full">#${t}</span>`).join('')}</div>
      <div class="mt-2 text-[10px] font-bold">💖 ${c.reactions?.love||0} 😭 ${c.reactions?.cry||0} ☕ ${c.reactions?.coffee||0} 🫣 ${c.reactions?.shy||0}</div>
    </div>`
  }).join('');
}

onSnapshot(query(colRef, orderBy("createdAt","desc")), snap=>{
  allData = snap.docs.map(d=>({firestoreId:d.id,...d.data()}));
  document.getElementById('totalInfo').innerText = allData.length + ' confess • Cerita Kita';
  document.getElementById('statTotal').innerText = allData.length;
  document.getElementById('statToday').innerText = allData.filter(c=>Date.now()-c.time<86400000).length;
  document.getElementById('statFoto').innerText = allData.filter(c=>c.photo).length;
  document.getElementById('statReport').innerText = allData.filter(c=>(c.level?.lv||0)>=3).length;
  renderAdmin();
});
</script>
</body>
</html>
