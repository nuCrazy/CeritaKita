<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin V7 Multi Ads</title>
<link rel="icon" type="image/jpeg" href="logo.png.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#5D0F1F',maroon2:'#8B1E3F',broken:'#FFF8E7',cream:'#FDE8C9',cream2:'#FFF1D6',gold:'#E8B86D'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif} body{background:#FFF8E7}</style>
</head>
<body class="p-4">
<div class="max-w-[1100px] mx-auto pb-20">
  <div class="flex justify-between items-center mb-5 bg-white border-[2.5px] border-maroon rounded-[18px] p-4 shadow-[4px_4px_0px_#5D0F1F]">
    <div class="flex items-center gap-3"><img src="logo.png.jpg" class="w-10 h-10 rounded-full border-2 border-maroon"><div><h1 class="text-[16px] font-extrabold text-maroon">Cerita Kita <span class="text-maroon2">Admin V7</span></h1><div class="text-[10px] opacity-60">5 Ads Auto Scroll + Dark Fix</div></div></div>
    <div class="text-[11px] bg-maroon text-white px-3 py-1 rounded-full font-bold" id="totalInfo">Loading...</div>
  </div>

  <div class="bg-white border-[2.5px] border-maroon rounded-[22px] p-5 shadow-[5px_5px_0px_#5D0F1F] mb-6">
    <div class="flex justify-between items-center mb-4"><h2 class="font-extrabold text-maroon">🏠 Edit Home</h2><button onclick="loadHomeConfigAdmin()" class="text-[10px] bg-cream border-2 border-maroon px-3 py-1 rounded-full font-bold">↻ Load</button></div>
    <div class="grid md:grid-cols-2 gap-4">
      <div><label class="text-[11px] font-bold">📜 Rules</label><textarea id="inputRules" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl p-3 text-[12px] min-h-[100px]"></textarea></div>
      <div><label class="text-[11px] font-bold">📢 Pengumuman</label><textarea id="inputPengumuman" class="mt-1 w-full bg-broken border-2 border-cream rounded-xl p-3 text-[12px] min-h-[80px]"></textarea><input id="inputTanggal" type="text" class="mt-2 w-full bg-broken border-2 border-cream rounded-xl px-3 py-2 text-[12px]" placeholder="24 Nov 2026"></div>
    </div>
    
    <div class="mt-5 p-4 bg-gradient-to-br from-cream2 to-cream rounded-xl border-2 border-gold">
      <div class="flex justify-between items-center"><label class="text-[12px] font-extrabold text-maroon">💰 Iklan (Max 5, Auto Scroll)</label><button onclick="addAd()" class="text-[10px] bg-maroon text-white px-3 py-1.5 rounded-full font-bold">+ Tambah Iklan</button></div>
      <div id="adsContainer" class="mt-3 space-y-4"></div>
    </div>

    <button onclick="saveHomeConfig()" id="saveHomeBtn" class="w-full mt-5 bg-maroon text-white py-3 rounded-xl font-bold text-[12px]">💾 Simpan Semua (Rules + 5 Iklan)</button>
    <div id="saveHomeStatus" class="text-[10px] text-center mt-2 font-bold text-maroon"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCToBiaTsuCCWrDnKK8cI1aQf7BDHICsQ4", authDomain: "confess-f4711.firebaseapp.com", projectId: "confess-f4711", storageBucket: "confess-f4711.firebasestorage.app", messagingSenderId: "484779882136", appId: "1:484779882136:web:52ec1b393f5777e2b582ed" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "cnfss");
let ads = [];

window.addAd = function(data={}){
  if(ads.length>=5){ alert('Max 5 iklan ta sayang!'); return; }
  let id = Date.now()+Math.random();
  let ad = {id, teks:data.teks||'', wa:data.wa||'', ig:data.ig||'', kontak:data.kontak||'', foto:data.foto||null};
  ads.push(ad); renderAds();
}
window.removeAd = function(id){ ads = ads.filter(a=>a.id!==id); renderAds(); }

window.previewAdFoto = function(e, id){
  let f = e.target.files[0]; if(!f) return;
  let r = new FileReader();
  r.onload = ev => {
    let img = new Image(); img.src = ev.target.result;
    img.onload = () => {
      let canvas = document.createElement('canvas');
      let maxW = 800; let scale = Math.min(1, maxW/img.width);
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      let base64 = canvas.toDataURL('image/jpeg',0.6);
      let a = ads.find(x=>x.id===id); if(a) a.foto=base64;
      renderAds();
    }
  }; r.readAsDataURL(f);
}

function renderAds(){
  document.getElementById('adsContainer').innerHTML = ads.map((a,i)=>`
    <div class="bg-white border-2 border-cream rounded-xl p-3">
      <div class="flex justify-between items-center"><span class="text-[11px] font-bold text-maroon">Iklan #${i+1}</span><button onclick="removeAd(${a.id})" class="text-[10px] bg-red-500 text-white px-2 py-1 rounded-full">Hapus</button></div>
      <textarea id="teks-${a.id}" oninput="updateAd(${a.id},'teks',this.value)" placeholder="Teks promo..." class="mt-2 w-full bg-broken border-2 border-cream rounded-xl p-2 text-[11px] min-h-[60px]">${a.teks}</textarea>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <input id="wa-${a.id}" value="${a.wa}" oninput="updateAd(${a.id},'wa',this.value)" placeholder="WA: 62812xxx" class="bg-broken border-2 border-cream rounded-xl px-2 py-2 text-[11px]">
        <input id="ig-${a.id}" value="${a.ig}" oninput="updateAd(${a.id},'ig',this.value)" placeholder="IG: @xxx" class="bg-broken border-2 border-cream rounded-xl px-2 py-2 text-[11px]">
      </div>
      <input id="kontak-${a.id}" value="${a.kontak}" oninput="updateAd(${a.id},'kontak',this.value)" placeholder="Kontak lain (opsional)" class="mt-2 w-full bg-broken border-2 border-cream rounded-xl px-2 py-2 text-[11px]">
      <div class="mt-2 flex gap-2">
        <input type="file" id="foto-${a.id}" accept="image/*" class="hidden" onchange="previewAdFoto(event,${a.id})">
        <button onclick="document.getElementById('foto-${a.id}').click()" class="bg-cream border-2 border-maroon rounded-xl px-3 py-1.5 text-[10px] font-bold">🖼️ Foto</button>
        ${a.foto ? `<img src="${a.foto}" class="w-20 h-20 object-cover rounded-xl border-2 border-cream"><button onclick="updateAd(${a.id},'foto',null)" class="text-[9px] bg-red-100 px-2 rounded-full">x</button>` : '<span class="text-[9px] opacity-40">Belum ada foto</span>'}
      </div>
    </div>
  `).join('') || '<div class="text-[11px] opacity-40 text-center py-4">Belum ada iklan, klik + Tambah Iklan</div>';
}
window.updateAd = function(id, key, val){ let a=ads.find(x=>x.id===id); if(a){ a[key]=val; } }

window.loadHomeConfigAdmin = async function(){
  try{
    const snap = await getDoc(doc(db, "home_config", "main"));
    if(snap.exists()){
      let d=snap.data();
      document.getElementById('inputRules').value=d.rules||'';
      document.getElementById('inputPengumuman').value=d.pengumuman||'';
      document.getElementById('inputTanggal').value=d.pengumumanDate||'';
      if(d.iklanList && Array.isArray(d.iklanList)){
        ads=[]; d.iklanList.forEach(item=>addAd(item));
      } else if(d.iklan){ // migrasi dari V6
        ads=[]; addAd({teks:d.iklan, wa:d.iklanWA||d.wa||'', ig:d.iklanIG||d.ig||'', kontak:d.iklanKontak||'', foto:d.iklanFoto||null});
      }
      document.getElementById('saveHomeStatus').innerText='✅ Loaded';
    }
  }catch(e){ document.getElementById('saveHomeStatus').innerText='Error: '+e.message; }
}
window.saveHomeConfig = async function(){
  let btn=document.getElementById('saveHomeBtn'); btn.disabled=true; btn.innerText='Menyimpan...';
  try{
    let cleanAds = ads.map(a=>({teks:a.teks, wa:a.wa, ig:a.ig, kontak:a.kontak, foto:a.foto})).filter(a=>a.teks||a.foto);
    await setDoc(doc(db, "home_config", "main"), {
      rules: document.getElementById('inputRules').value,
      pengumuman: document.getElementById('inputPengumuman').value,
      pengumumanDate: document.getElementById('inputTanggal').value,
      iklanList: cleanAds,
      // simpan juga versi lama buat kompatibilitas V6.2
      iklan: cleanAds[0]?.teks||'',
      iklanFoto: cleanAds[0]?.foto||null,
      iklanWA: cleanAds[0]?.wa||'',
      iklanIG: cleanAds[0]?.ig||'',
      iklanKontak: cleanAds[0]?.kontak||'',
      updatedAt: Date.now()
    }, {merge:true});
    document.getElementById('saveHomeStatus').innerText='✅ Tersimpan! '+cleanAds.length+' iklan aktif';
  }catch(e){ document.getElementById('saveHomeStatus').innerText='❌ '+e.message; }
  btn.disabled=false; btn.innerText='💾 Simpan Semua';
}
loadHomeConfigAdmin();
</script>
</body>
</html>
