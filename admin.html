<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Berita Kampus v8.2 FIX</title>
<link rel="icon" type="image/jpeg" href="logo.png.jpg">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#5D0F1F',maroon2:'#8B1E3F',broken:'#FFF8E7',cream:'#FDE8C9',cream2:'#FFF1D6',gold:'#E8B86D'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif} body{background: linear-gradient(180deg, #FFF8E7 0%, #FDE8C9 100%); min-height:100vh} .broken-white{background:#FFFBF0; border:2px solid #FDE8C9} .soft-card{background: linear-gradient(135deg, #FFFBF0 0%, #FFF1D6 100%); border: 2.5px solid #5D0F1F; box-shadow: 5px 5px 0px #5D0F1F}</style>
</head>
<body class="p-4">
<div class="max-w-[900px] mx-auto">
<header class="soft-card rounded-[20px] p-5 flex justify-between items-center mb-6">
<div class="flex items-center gap-3"><img src="logo.png.jpg" class="w-10 h-10 rounded-full border-2 border-maroon"><div><h1 class="font-extrabold text-maroon text-[18px]">Admin Berita Kampus FIX</h1><div class="text-[10px] opacity-60">Max 10 poster • Anti Hilang Iklan/Rules</div></div></div>
<div class="flex gap-2"><button onclick="loadData()" class="bg-cream2 border-2 border-maroon px-4 py-2 rounded-xl font-bold text-[11px]">🔄 Reload</button><div id="conn" class="text-[9px] bg-maroon text-white px-3 py-2 rounded-full">Menghubungkan...</div></div>
</header>

<div class="grid md:grid-cols-[360px_1fr] gap-4">
<div class="soft-card rounded-[20px] p-5 h-fit sticky top-4">
<h2 class="font-extrabold text-maroon text-[14px]" id="formTitle">➕ Tambah Berita Baru</h2>
<div class="mt-4 space-y-3">
<div><label class="text-[11px] font-bold">Judul / Isi Berita *</label><textarea id="fTeks" placeholder="Seminar Nasional Teknik 2026 - Daftar sekarang!" class="mt-1 w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2.5 text-[12px] min-h-[80px]"></textarea></div>
<div class="grid grid-cols-2 gap-2">
<div><label class="text-[11px] font-bold">Kategori</label><select id="fKategori" class="mt-1 w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2.5 text-[11px]"><option>Info Kampus</option><option>Seminar</option><option>Lomba</option><option>Akademik</option><option>UKM</option><option>Beasiswa</option><option>Lowongan</option><option>Event</option></select></div>
<div><label class="text-[11px] font-bold">Tanggal</label><input id="fTanggal" type="text" placeholder="24 Nov 2026" class="mt-1 w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2.5 text-[11px]"></div>
</div>

<div>
<label class="text-[11px] font-bold">Foto Poster * (auto compress max 900KB)</label>
<div class="mt-2 grid grid-cols-2 gap-2">
<button onclick="document.getElementById('fFotoGaleri').click()" class="broken-white rounded-xl py-2.5 text-[11px] font-bold">🖼️ Galeri</button>
<button onclick="document.getElementById('fFotoKamera').click()" class="broken-white rounded-xl py-2.5 text-[11px] font-bold">📸 Kamera</button>
</div>
<input type="file" id="fFotoGaleri" accept="image/*" class="hidden" onchange="previewBeritaFoto(event)">
<input type="file" id="fFotoKamera" accept="image/*" capture="environment" class="hidden" onchange="previewBeritaFoto(event)">
<img id="fFotoPreview" class="hidden w-full h-[200px] object-cover rounded-xl border-2 border-cream mt-2">
<div class="flex gap-2 mt-2">
<button id="fFotoRemove" onclick="removeBeritaFoto()" class="hidden text-[10px] bg-red-500 text-white px-3 py-1.5 rounded-full font-bold">🗑️ Hapus Foto</button>
<span id="fFotoSize" class="text-[10px] opacity-60 py-1"></span>
</div>
</div>

<div class="pt-3 border-t-2 border-dashed border-cream space-y-2">
<div class="font-bold text-[11px] text-maroon">Kontak (opsional)</div>
<input id="fWA" placeholder="WA: 6281234567890" class="w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2 text-[11px]">
<input id="fIG" placeholder="IG: @bem_kampus" class="w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2 text-[11px]">
<input id="fLink" placeholder="Link daftar: https://forms.gle/..." class="w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2 text-[11px]">
<input id="fKontak" placeholder="CP: 0812xxxx - Sekretariat" class="w-full bg-[#FFFBF0] border-2 border-cream rounded-xl px-3 py-2 text-[11px]">
</div>

<div class="grid grid-cols-2 gap-2 pt-2">
<button onclick="resetForm()" class="bg-broken border-2 border-cream py-2.5 rounded-xl font-bold text-[11px]">Batal</button>
<button onclick="saveBerita()" id="saveBtn" class="bg-maroon text-white py-2.5 rounded-xl font-bold text-[11px]">💾 Simpan Berita</button>
</div>
<div id="formInfo" class="text-[10px] text-center mt-2 opacity-60"></div>
</div>
</div>

<div class="space-y-3">
<div class="soft-card rounded-[18px] p-4 flex justify-between items-center">
<div><div class="font-extrabold text-maroon text-[13px]">📋 Daftar Berita (<span id="count">0</span>/10)</div><div class="text-[10px] opacity-50">Edit untuk ganti urutan</div></div>
<button onclick="if(confirm('Hapus semua berita?')) clearAll()" class="text-[10px] bg-red-100 border px-3 py-1.5 rounded-full font-bold">🗑️ Hapus Semua</button>
</div>
<div id="list" class="space-y-3"></div>
<div id="empty" class="hidden text-center py-12 opacity-40">
<div class="text-[40px]">📰</div>
<div class="text-[12px] font-bold mt-2">Belum ada berita</div>
<div class="text-[10px] mt-1">Tambah berita pertama di kiri</div>
</div>
</div>
</div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-maroon text-white px-6 py-3 rounded-full text-[12px] font-bold shadow translate-y-[100px] opacity-0 transition-all z-[200]"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCToBiaTsuCCWrDnKK8cI1aQf7BDHICsQ4", authDomain: "confess-f4711.firebaseapp.com", projectId: "confess-f4711", storageBucket: "confess-f4711.firebasestorage.app", messagingSenderId: "484779882136", appId: "1:484779882136:web:52ec1b393f5777e2b582ed" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "cnfss");
const docRef = doc(db, "home_config", "main");
let beritaList = [];
let editIndex = -1;
let fotoBase64 = null;

function showToast(msg){
  let t=document.getElementById('toast');
  t.innerText=msg;
  t.classList.remove('translate-y-[100px]','opacity-0');
  t.classList.add('translate-y-0','opacity-100');
  setTimeout(()=>{ t.classList.add('translate-y-[100px]','opacity-0'); },2500);
}

window.previewBeritaFoto=function(e){
  try{
    let f=e.target.files[0];
    if(!f) return;
    if(f.size > 5*1024*1024){ showToast('Foto max 5MB ya!'); return; }
    let r=new FileReader();
    r.onload=ev=>{
      let img=new Image();
      img.src=ev.target.result;
      img.onload=()=>{
        let canvas=document.createElement('canvas');
        let maxW=800;
        let scale=Math.min(1, maxW / img.width);
        canvas.width=img.width*scale;
        canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        let base64=canvas.toDataURL('image/jpeg', 0.6);
        let sizeKB=Math.round(base64.length*0.75/1024);
        if(sizeKB > 900){
          base64=canvas.toDataURL('image/jpeg', 0.4);
          sizeKB=Math.round(base64.length*0.75/1024);
        }
        if(sizeKB > 900){
          showToast('Foto masih kegedean '+sizeKB+'KB, coba foto lain');
          return;
        }
        fotoBase64=base64;
        document.getElementById('fFotoPreview').src=base64;
        document.getElementById('fFotoPreview').classList.remove('hidden');
        document.getElementById('fFotoRemove').classList.remove('hidden');
        document.getElementById('fFotoSize').innerText=sizeKB+'KB - pas sama di Home! ✅';
        showToast('Foto '+sizeKB+'KB siap! 💖');
      };
    };
    r.readAsDataURL(f);
  }catch(err){ showToast('Error foto'); }
}

window.removeBeritaFoto=function(){
  fotoBase64=null;
  document.getElementById('fFotoGaleri').value='';
  document.getElementById('fFotoKamera').value='';
  document.getElementById('fFotoPreview').classList.add('hidden');
  document.getElementById('fFotoRemove').classList.add('hidden');
  document.getElementById('fFotoSize').innerText='';
}

window.resetForm=function(){
  editIndex=-1;
  fotoBase64=null;
  document.getElementById('formTitle').innerText='➕ Tambah Berita Baru';
  document.getElementById('fTeks').value='';
  document.getElementById('fKategori').value='Info Kampus';
  document.getElementById('fTanggal').value=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
  document.getElementById('fWA').value='';
  document.getElementById('fIG').value='';
  document.getElementById('fLink').value='';
  document.getElementById('fKontak').value='';
  document.getElementById('fFotoGaleri').value='';
  document.getElementById('fFotoKamera').value='';
  document.getElementById('fFotoPreview').classList.add('hidden');
  document.getElementById('fFotoRemove').classList.add('hidden');
  document.getElementById('fFotoSize').innerText='';
  document.getElementById('saveBtn').innerText='💾 Simpan Berita';
  document.getElementById('formInfo').innerText='';
}

window.loadData=async function(){
  try{
    let snap=await getDoc(docRef);
    if(snap.exists()){
      let data=snap.data();
      beritaList=data.beritaList && Array.isArray(data.beritaList) ? data.beritaList : [];
      renderList();
      document.getElementById('conn').innerText='✅ LIVE - '+beritaList.length+' berita';
    } else {
      document.getElementById('conn').innerText='⚠️ Belum ada data';
    }
  }catch(e){ document.getElementById('conn').innerText='❌ Error: '+e.message; }
}

function renderList(){
  let listEl=document.getElementById('list');
  let countEl=document.getElementById('count');
  let emptyEl=document.getElementById('empty');
  countEl.innerText=beritaList.length;
  if(beritaList.length===0){
    listEl.innerHTML='';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');
  listEl.innerHTML=beritaList.map((b,i)=>`
    <div class="soft-card rounded-[16px] p-3 flex gap-3">
      ${b.foto?`<img src="${b.foto}" class="w-20 h-20 object-cover rounded-xl border-2 border-cream shrink-0">`:`<div class="w-20 h-20 bg-cream2 rounded-xl grid place-items-center border-2 border-cream shrink-0 text-[24px]">📰</div>`}
      <div class="flex-1 min-w-0">
        <div class="flex gap-1 items-center">
          <span class="text-[8px] bg-maroon text-white px-2 py-0.5 rounded-full font-bold">${b.kategori||'Info'}</span>
          <span class="text-[8px] opacity-50">${b.tanggal||''}</span>
          <span class="text-[8px] bg-gold text-maroon px-1.5 py-0.5 rounded-full font-bold">#${i+1}</span>
        </div>
        <div class="text-[11px] font-bold leading-4 mt-1 line-clamp-2">${(b.teks||'').replace(/</g,'&lt;')}</div>
        <div class="text-[9px] opacity-50 mt-1">${b.foto?Math.round(b.foto.length*0.75/1024)+'KB':''} ${b.link?'• 🔗 link':''} ${b.wa?'• WA':''}</div>
        <div class="flex gap-1 mt-2">
          <button onclick="editBerita(${i})" class="text-[10px] bg-yellow-100 border-2 border-cream px-2.5 py-1 rounded-full font-bold">✏️ Edit</button>
          <button onclick="hapusBerita(${i})" class="text-[10px] bg-red-100 border-2 border-cream px-2.5 py-1 rounded-full font-bold">🗑️ Hapus</button>
          <button onclick="moveUp(${i})" class="text-[10px] broken-white px-2 py-1 rounded-full font-bold ${i===0?'opacity-30':''}">⬆️</button>
          <button onclick="moveDown(${i})" class="text-[10px] broken-white px-2 py-1 rounded-full font-bold ${i===beritaList.length-1?'opacity-30':''}">⬇️</button>
        </div>
      </div>
    </div>
  `).join('');
}

window.editBerita=function(i){
  let b=beritaList[i];
  if(!b) return;
  editIndex=i;
  document.getElementById('formTitle').innerText='✏️ Edit Berita #'+(i+1);
  document.getElementById('fTeks').value=b.teks||'';
  document.getElementById('fKategori').value=b.kategori||'Info Kampus';
  document.getElementById('fTanggal').value=b.tanggal||'';
  document.getElementById('fWA').value=b.wa||'';
  document.getElementById('fIG').value=b.ig||'';
  document.getElementById('fLink').value=b.link||'';
  document.getElementById('fKontak').value=b.kontak||'';
  fotoBase64=b.foto||null;
  if(b.foto){
    document.getElementById('fFotoPreview').src=b.foto;
    document.getElementById('fFotoPreview').classList.remove('hidden');
    document.getElementById('fFotoRemove').classList.remove('hidden');
    document.getElementById('fFotoSize').innerText=Math.round(b.foto.length*0.75/1024)+'KB';
  }
  document.getElementById('saveBtn').innerText='💾 Update Berita #'+(i+1);
  document.getElementById('formInfo').innerText='Lagi edit berita ke-'+(i+1);
  window.scrollTo({top:0,behavior:'smooth'});
}

window.hapusBerita=async function(i){
  if(!confirm('Hapus berita #'+(i+1)+'?')) return;
  beritaList.splice(i,1);
  await saveToFirebase();
}

window.moveUp=async function(i){
  if(i===0) return;
  let tmp=beritaList[i];
  beritaList[i]=beritaList[i-1];
  beritaList[i-1]=tmp;
  await saveToFirebase();
}

window.moveDown=async function(i){
  if(i===beritaList.length-1) return;
  let tmp=beritaList[i];
  beritaList[i]=beritaList[i+1];
  beritaList[i+1]=tmp;
  await saveToFirebase();
}

window.clearAll=async function(){
  if(!confirm('Yakin hapus semua berita?')) return;
  beritaList=[];
  await saveToFirebase();
}

// INI FIX UTAMA ANTI HILANG
async function saveToFirebase(){
  try{
    document.getElementById('conn').innerText='⏳ Menyimpan...';
    // 1. Ambil data lama dulu biar field lain gak ilang
    let snap = await getDoc(docRef);
    let existing = snap.exists() ? snap.data() : {};
    // 2. Gabung data lama + berita baru
    let newData = { ...existing, beritaList: beritaList };
    // 3. Simpan dengan merge:true biar aman
    await setDoc(docRef, newData, { merge: true });
    renderList();
    document.getElementById('conn').innerText='✅ Tersimpan - '+beritaList.length+' berita (iklan/rules aman)';
    showToast('Tersimpan! Iklan & Rules gak ilang ✅');
  }catch(err){
    showToast('Gagal simpan: '+err.message);
    document.getElementById('conn').innerText='❌ Gagal';
  }
}

window.saveBerita=async function(){
  let teks=document.getElementById('fTeks').value.trim();
  if(teks.length<5){ alert('Isi berita minimal 5 huruf'); return; }
  if(!fotoBase64){ alert('Foto poster wajib! Upload foto dulu ta'); return; }
  if(beritaList.length>=10 && editIndex===-1){ alert('Max 10 berita ta! Hapus dulu yang lama'); return; }

  let data={
    teks: teks,
    foto: fotoBase64,
    kategori: document.getElementById('fKategori').value,
    tanggal: document.getElementById('fTanggal').value || new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}),
    wa: document.getElementById('fWA').value.trim(),
    ig: document.getElementById('fIG').value.trim(),
    link: document.getElementById('fLink').value.trim(),
    kontak: document.getElementById('fKontak').value.trim()
  };

  if(editIndex>=0){
    beritaList[editIndex]=data;
  } else {
    beritaList.unshift(data);
    if(beritaList.length>10) beritaList=beritaList.slice(0,10);
  }

  await saveToFirebase();
  resetForm();
}

// Auto load live
onSnapshot(docRef, (snap)=>{
  if(snap.exists()){
    let data=snap.data();
    beritaList=data.beritaList && Array.isArray(data.beritaList) ? data.beritaList : [];
    renderList();
    document.getElementById('conn').innerText='✅ LIVE - '+beritaList.length+' berita (auto)';
  } else {
    document.getElementById('conn').innerText='⚠️ Dokumen belum ada - akan dibuat pas save';
  }
});

resetForm();
document.getElementById('fTanggal').value=new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
</script>
</body>
</html>
